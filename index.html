<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover + user-scalable=no: полноэкранный режим без зума на телефоне -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>Tower Defense — прототип</title>
  <style>
    /* Убираем отступы браузера, растягиваем игру на весь экран */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      /* Чтобы тапы не выделяли текст и не зумили страницу на мобильных */
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    /* Контейнер, в который Phaser вставит <canvas> */
    #game {
      width: 100%;
      height: 100%;
    }

    #game canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Phaser 3 подключаем через CDN (ничего скачивать не нужно) -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <!-- Firebase: конфиг и инициализация Firestore.
       type="module" — современный способ подключения Firebase SDK. -->
  <script type="module" src="firebase-config.js"></script>
  <!-- Наш игровой код. Тоже модуль, чтобы импортировать db из firebase-config.js -->
  <script type="module" src="game.js"></script>
</body>
</html>
