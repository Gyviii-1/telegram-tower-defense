name: Telegram bot

# Бот работает в облаке GitHub 24/7 и не требует включённого ПК.
# Расписание: каждые 4 часа. Каждый прогон живёт до ~5ч50м, но новый запуск
# отменяет старый (cancel-in-progress), поэтому бот не «провисает» в паузах:
# даже при задержке расписания старый прогон ещё жив и закрывает дырку.

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Restore Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > bot/service-account.json

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CREATOR_ID: ${{ secrets.CREATOR_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PYTHONUNBUFFERED: "1"
        run: python -u bot/bot.py
